name: Keep Supabase Alive

on:
  schedule:
    # Runs at 9:00 AM UTC every Monday and Thursday (Twice a week is perfect)
    - cron: "0 9 * * 1,4"
  workflow_dispatch: # Allows you to trigger it manually anytime for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase via PostgREST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -X GET "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}"
